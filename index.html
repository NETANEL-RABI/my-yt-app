<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaApp - עם חיפוש קולי וגלילה אינסופית</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">

  <!-- סרגל עליון -->
  <header class="navbar">
    <div class="logo">
      <i class="material-icons brand-icon">play_circle_filled</i>
      <span>MediaApp</span>
    </div>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="חיפוש...">
      <button id="searchBtn"><i class="material-icons">search</i></button>
      <!-- כפתור חיפוש קולי -->
      <button id="voiceSearchBtn" class="icon-btn voice-btn" title="חיפוש קולי">
        <i class="material-icons">mic</i>
      </button>
    </div>

    <div class="user-actions">
      <span id="userGreeting"></span>
      <button id="authBtn" class="btn">התחברות</button>
      <button id="themeToggleBtn" class="icon-btn">
        <i class="material-icons">dark_mode</i>
      </button>
    </div>
  </header>

  <!-- תפריט ניווט לקטגוריות -->
  <nav class="category-bar">
    <button id="navHome" class="active"><i class="material-icons">home</i> ראשי</button>
    <button id="navShorts"><i class="material-icons">smartphone</i> Shorts</button>
    <button id="navWatchLater"><i class="material-icons">watch_later</i> צפייה מאוחרת</button>
    <button id="navHistory"><i class="material-icons">history</i> היסטוריה</button>
  </nav>

  <!-- סרגל תגיות לסינון קטגוריות -->
  <div class="filter-chips">
    <button class="chip active" data-query="טכנולוגיה ומחשבים">הכל</button>
    <button class="chip" data-query="מדריכי תכנות">תכנות</button>
    <button class="chip" data-query="חדשות טכנולוגיה">חדשות</button>
    <button class="chip" data-query="פודקאסט טכנולוגי">פודקאסטים</button>
  </div>

  <!-- תוכן מרכזי -->
  <main class="content-container">
    <h2 id="sectionTitle">תוכן מומלץ</h2>
    <div id="videoGrid" class="video-grid"></div>
    <div id="loadingIndicator" class="loading-spinner" style="display: none;">
      <i class="material-icons spin">autorenew</i>
    </div>
  </main>

  <!-- חלון מודאלי להרשמה / התחברות -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span id="closeAuthModal" class="close">&times;</span>
      <h3>התחברות / הרשמה</h3>
      <input type="text" id="usernameInput" placeholder="הכנס שם משתמש">
      <button id="loginSubmitBtn" class="btn">התחבר</button>
    </div>
  </div>

  <!-- נגן וידאו פנימי עם כפתור שיתוף -->
  <div id="videoModal" class="modal">
    <div class="modal-content video-player-container">
      <div class="modal-header">
        <button id="shareBtn" class="btn share-btn"><i class="material-icons">share</i> שתף קישור</button>
        <span id="closeVideoModal" class="close">&times;</span>
      </div>
      <iframe id="youtubeIframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <footer>
    <p>נבנה על ידי <a href="https://mitmachim.top/user/%D7%9E%D7%97%D7%95%D7%91%D7%A2-23" target="_blank" rel="noopener noreferrer">מחובר</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
