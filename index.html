<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaApp - עם הרשמה, היסטוריה ושורטס</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <i class="material-icons brand-icon">play_circle_filled</i>
      <span>MediaApp</span>
    </div>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="חיפוש...">
      <button id="searchBtn"><i class="material-icons">search</i></button>
    </div>

    <div class="user-actions">
      <span id="userGreeting"></span>
      <button id="authBtn" class="btn">התחברות</button>
    </div>
  </header>

  <nav class="category-bar">
    <button id="navHome" class="active"><i class="material-icons">home</i> ראשי</button>
    <button id="navShorts"><i class="material-icons">smartphone</i> Shorts</button>
    <button id="navHistory"><i class="material-icons">history</i> היסטוריה</button>
  </nav>

  <main class="content-container">
    <h2 id="sectionTitle">סרטונים מומלצים</h2>
    <div id="videoGrid" class="video-grid"></div>
  </main>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h3>התחברות / הרשמה</h3>
      <input type="text" id="usernameInput" placeholder="הכנס שם משתמש">
      <button id="loginSubmitBtn" class="btn">התחבר</button>
    </div>
  </div>

  <footer>
    <p>נבנה על ידי <a href="https://mitmachim.top/user/%D7%9E%D7%97%D7%95%D7%91%D7%A2-23" target="_blank" rel="noopener noreferrer">מחובר</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
